name: punkt

services:
  punkt:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        PUNKT_BUILD_VERSION: ${PUNKT_BUILD_VERSION:-}
    environment:
      AGENT_MODE: ${AGENT_MODE:-mock}
      AGENT_SOURCES: ${AGENT_SOURCES:-demo}
      RETRIEVAL_MODE: ${RETRIEVAL_MODE:-bm25}
      LLM_BASE_URL: ${LLM_BASE_URL:-http://host.docker.internal:11434}
      LLM_MODEL: ${LLM_MODEL:-qwen3:8b}
      KESHAKING_DB_PATH: /var/lib/punkt/mock.sqlite3
      PUNKT_WEB_DIR: /opt/punkt/web
      PUNKT_TEST_MAIL: ${PUNKT_TEST_MAIL:-0}
      PUNKT_EMPLOYEE_PASSWORD: ${PUNKT_EMPLOYEE_PASSWORD:?Set PUNKT_EMPLOYEE_PASSWORD}
      PUNKT_QUALITY_PASSWORD: ${PUNKT_QUALITY_PASSWORD:?Set PUNKT_QUALITY_PASSWORD}
      PUNKT_MAIL_PASSWORD: ${PUNKT_MAIL_PASSWORD:-}
    ports:
      - "127.0.0.1:${PUNKT_PORT:-8080}:8080"
    volumes:
      - punkt-data:/var/lib/punkt
      - ../data:/opt/punkt/data:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/opt/punkt/backend/.venv/bin/python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8080/api/ready', timeout=4).close()"]
      interval: 5s
      timeout: 5s
      retries: 6
      start_period: 5s

  mailpit:
    image: axllent/mailpit:v1.27.4
    profiles: [quality-mail]
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        case "$$PUNKT_MAIL_PASSWORD" in
          ''|*[!A-Za-z0-9_-]*)
            echo "Set PUNKT_MAIL_PASSWORD using letters, digits, hyphens or underscores." >&2
            exit 1
            ;;
        esac
        umask 077
        printf 'punkt:%s\n' "$$PUNKT_MAIL_PASSWORD" > /tmp/mailpit-auth
        exec /mailpit
    environment:
      PUNKT_MAIL_PASSWORD: ${PUNKT_MAIL_PASSWORD:-}
      MP_UI_AUTH_FILE: /tmp/mailpit-auth
      MP_SEND_API_AUTH_FILE: /tmp/mailpit-auth
      MP_SMTP_AUTH_FILE: /tmp/mailpit-auth
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
      MP_DATABASE: /data/mailpit.db
      MP_DISABLE_VERSION_CHECK: "true"
    ports:
      - "127.0.0.1:${PUNKT_MAIL_PORT:-8025}:8025"
    volumes:
      - punkt-mail:/data
    restart: unless-stopped

volumes:
  punkt-data:
  punkt-mail:
