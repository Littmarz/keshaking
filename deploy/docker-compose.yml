name: punkt

services:
  punkt:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        PUNKT_BUILD_VERSION: ${PUNKT_BUILD_VERSION:-}
    environment:
      AGENT_MODE: ${AGENT_MODE:-mock}
      AGENT_SOURCES: ${AGENT_SOURCES:-demo}
      RETRIEVAL_MODE: ${RETRIEVAL_MODE:-bm25}
      LLM_BASE_URL: ${LLM_BASE_URL:-http://host.docker.internal:11434}
      LLM_MODEL: ${LLM_MODEL:-qwen3:8b}
      KESHAKING_DB_PATH: /var/lib/punkt/mock.sqlite3
      PUNKT_WEB_DIR: /opt/punkt/web
      PUNKT_TEST_MAIL: ${PUNKT_TEST_MAIL:-0}
    ports:
      - "127.0.0.1:${PUNKT_PORT:-8080}:8080"
    volumes:
      - punkt-data:/var/lib/punkt
      - ../data:/opt/punkt/data:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/opt/punkt/backend/.venv/bin/python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8080/api/health', timeout=2).close()"]
      interval: 5s
      timeout: 3s
      retries: 6
      start_period: 5s

  mailpit:
    image: axllent/mailpit:v1.27.4
    profiles: [quality-mail]
    environment:
      MP_DATABASE: /data/mailpit.db
    ports:
      - "127.0.0.1:${PUNKT_MAIL_PORT:-8025}:8025"
    volumes:
      - punkt-mail:/data
    restart: unless-stopped

volumes:
  punkt-data:
  punkt-mail:
