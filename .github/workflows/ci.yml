name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.10"
      - name: Backend
        working-directory: backend
        run: |
          uv sync --locked
          PYTHONPATH=.. .venv/bin/python -m unittest discover -s tests
      - name: Поиск и eval (без DOCX заказчика тесты корпуса пропускаются)
        run: |
          backend/.venv/bin/python -m unittest discover -s retrieval/tests -t .
          backend/.venv/bin/python -m unittest discover -s eval/tests
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npx tsc --noEmit
          npx vite build
